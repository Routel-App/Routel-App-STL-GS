# Deploys the site to Vercel with the Vercel CLI.
# Works on the Vercel Hobby plan with a private organisation repository,
# because the files are uploaded by the CLI instead of Vercel's Git integration.
#
# One-time setup:
#   1. Create a token at https://vercel.com/account/tokens (scope: the Routel team).
#   2. Add it to this repo: Settings → Secrets and variables → Actions → New secret
#      Name: VERCEL_TOKEN
# The first run creates the "stl-gs" project in the Routel team automatically.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  VERCEL_SCOPE: routel
  VERCEL_PROJECT: stl-gs

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        id: token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set — skipping deployment."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Install Vercel CLI
        if: steps.token.outputs.ok == 'true'
        run: npm install --global vercel@latest

      - name: Link project (creates it on first run)
        if: steps.token.outputs.ok == 'true'
        run: vercel link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Pull project settings
        if: steps.token.outputs.ok == 'true'
        run: vercel pull --yes --environment=production --scope "$VERCEL_SCOPE" --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Build
        if: steps.token.outputs.ok == 'true'
        run: vercel build --prod --scope "$VERCEL_SCOPE" --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: |
          url=$(vercel deploy --prebuilt --prod --scope "$VERCEL_SCOPE" --token "${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed: $url"
          echo "### Deployed to Vercel: $url" >> "$GITHUB_STEP_SUMMARY"
