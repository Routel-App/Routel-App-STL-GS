<!doctype html>
<!--
  STL Global Solutions — business card (print source)
  Trim size 90 × 50 mm, 3 mm bleed on every side → page 96 × 56 mm.
  Keep text inside the safe area (4 mm inside the trim).
  Edit the details below, then run:  node render.mjs
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>STL Business Card — Abdulrahman Ameen</title>
<style>
  @font-face { font-family: 'Readex Pro'; font-weight: 300; src: url(fonts/readex-pro-latin-300-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
  @font-face { font-family: 'Readex Pro'; font-weight: 400; src: url(fonts/readex-pro-latin-400-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
  @font-face { font-family: 'Readex Pro'; font-weight: 500; src: url(fonts/readex-pro-latin-500-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
  @font-face { font-family: 'Readex Pro'; font-weight: 600; src: url(fonts/readex-pro-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+2000-206F, U+20AC, U+2122; }
  @font-face { font-family: 'Readex Pro'; font-weight: 300; src: url(fonts/readex-pro-arabic-300-normal.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: 'Readex Pro'; font-weight: 400; src: url(fonts/readex-pro-arabic-400-normal.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: 'Readex Pro'; font-weight: 500; src: url(fonts/readex-pro-arabic-500-normal.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }
  @font-face { font-family: 'Readex Pro'; font-weight: 600; src: url(fonts/readex-pro-arabic-600-normal.woff2) format('woff2'); unicode-range: U+0600-06FF, U+0750-077F, U+FB50-FDFF, U+FE70-FEFF; }

  :root {
    --petrol: #073b3a; --coral: #ff7058; --sand: #f4efe6; --mint: #a7c5c2;
    --paper: #fbf9f5; --ink: #0a1f1e; --muted: #5e6f6d;
    --bleed: 3mm; --safe: 7mm; /* bleed + 4mm */
  }
  @page { size: 96mm 56mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #888; }
  body { font-family: 'Readex Pro', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card { position: relative; width: 96mm; height: 56mm; overflow: hidden; page-break-after: always; break-after: page; }
  .card:last-child { page-break-after: auto; break-after: auto; }
  @media screen { body { display: grid; gap: 8mm; padding: 10mm; justify-content: center; } }

  /* ---------------- FRONT ---------------- */
  .front { background: var(--paper); color: var(--ink); }
  .front .logo { position: absolute; top: var(--safe); left: var(--safe); height: 8.6mm; }
  .front .ar { position: absolute; top: calc(var(--safe) - .4mm); right: 22mm; text-align: right; direction: rtl; }
  .front .ar .n { font-size: 8.2pt; font-weight: 600; color: var(--petrol); line-height: 1.35; }
  .front .ar .t { font-size: 6.4pt; font-weight: 500; color: #c2452f; line-height: 1.4; }

  .front .who { position: absolute; left: var(--safe); top: 22.2mm; }
  .front .name { font-size: 12.4pt; font-weight: 600; color: var(--petrol); letter-spacing: -.01em; line-height: 1.1; }
  .front .role { margin-top: 1.4mm; display: flex; align-items: center; gap: 1.6mm; font-size: 7pt; font-weight: 500; color: #c2452f; letter-spacing: .02em; }
  .slash { display: inline-block; width: 1.3mm; height: 3mm; background: var(--coral); transform: skewX(-22deg); }

  .front .contact { position: absolute; left: var(--safe); bottom: calc(var(--safe) - .6mm); display: grid; grid-template-columns: auto auto; gap: 1.5mm 5mm; font-size: 6.1pt; font-weight: 400; color: var(--ink); }
  .front .contact div { display: flex; align-items: center; gap: 1.4mm; white-space: nowrap; }
  .front .contact svg { width: 2.6mm; height: 2.6mm; flex-shrink: 0; stroke: var(--coral); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .front .rule { position: absolute; left: var(--safe); right: 22mm; top: 36.4mm; height: .25mm; background: #e2dbcd; }

  /* right edge: petrol band with the forward cut + coral slash */
  .front .edge { position: absolute; top: 0; right: 0; bottom: 0; width: 22mm; background: var(--petrol); clip-path: polygon(48% 0, 100% 0, 100% 100%, 0 100%); }
  .front .edge-coral { position: absolute; bottom: 0; right: 13.2mm; width: 4.2mm; height: 30mm; background: var(--coral); transform: skewX(-17.5deg); transform-origin: bottom; }
  .front .edge-mint { position: absolute; bottom: 0; right: 8.4mm; width: 1.3mm; height: 20mm; background: var(--mint); opacity: .55; transform: skewX(-17.5deg); transform-origin: bottom; }
  .front .edge-icon { position: absolute; top: calc(var(--safe) + .2mm); right: calc(var(--bleed) + 3.4mm); width: 8.4mm; height: 8.4mm; border-radius: 1.6mm; }

  /* ---------------- BACK ---------------- */
  .back { background: var(--petrol); color: var(--cream); }
  .back .logo { position: absolute; left: var(--safe); top: 50%; transform: translateY(-78%); height: 15mm; }
  .back .tag { position: absolute; left: var(--safe); bottom: var(--safe); font-size: 6.2pt; color: var(--mint); line-height: 1.55; }
  .back .tag b { color: #fff; font-weight: 500; }
  .back .tag .ar { direction: rtl; display: block; text-align: left; unicode-bidi: plaintext; }
  .back .s1 { position: absolute; bottom: -2mm; right: 18mm; width: 9mm; height: 64mm; background: var(--coral); transform: skewX(-22deg); transform-origin: bottom; }
  .back .s2 { position: absolute; bottom: -2mm; right: 9.5mm; width: 2.6mm; height: 44mm; background: var(--mint); opacity: .45; transform: skewX(-22deg); transform-origin: bottom; }
  .back .s3 { position: absolute; bottom: -2mm; right: 30.5mm; width: 1.4mm; height: 30mm; background: var(--sand); opacity: .18; transform: skewX(-22deg); transform-origin: bottom; }
  .back .web { display: block; margin-top: 1.6mm; padding-top: 1.6mm; border-top: .25mm solid rgba(167, 197, 194, .35); color: #fff; letter-spacing: .04em; width: 34mm; }

  /* guides (screen preview only) */
  .guides .card::after { content: ''; position: absolute; inset: var(--bleed); outline: .2mm dashed rgba(255, 0, 140, .7); pointer-events: none; }
  .guides .card::before { content: ''; position: absolute; inset: var(--safe); outline: .2mm dotted rgba(0, 160, 255, .7); pointer-events: none; z-index: 5; }
</style>
</head>
<body>
  <!-- FRONT -->
  <section class="card front">
    <img class="logo" src="../../public/brand/stl-logo-transparent.png" alt="STL Global Solutions" />
    <div class="ar">
      <div class="n">عبدالرحمن أمين</div>
      <div class="t">المدير العام</div>
    </div>

    <div class="who">
      <div class="name">Abdulrahman Ameen</div>
      <div class="role"><span class="slash"></span>General Manager</div>
    </div>
    <div class="rule"></div>

    <div class="contact">
      <div><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg><span>[+966 5X XXX XXXX]</span></div>
      <div><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>[abdulrahman@stl-global.sa]</span></div>
      <div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>[www.stl-global.sa]</span></div>
      <div><svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span>[City], Saudi Arabia</span></div>
    </div>

    <div class="edge"></div>
    <div class="edge-coral"></div>
    <div class="edge-mint"></div>
  </section>

  <!-- BACK -->
  <section class="card back">
    <span class="s3"></span>
    <span class="s1"></span>
    <span class="s2"></span>
    <img class="logo" src="../../public/brand/stl-logo-white.png" alt="STL Global Solutions" />
    <div class="tag">
      <b>From Global Ports to Your Doorstep</b>
      <span class="ar">من موانئ العالم.. إلى باب عملك</span>
      <span class="web">[www.stl-global.sa]</span>
    </div>
  </section>
</body>
</html>
