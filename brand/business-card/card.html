<!doctype html>
<!--
  STL Global Forwarding — business card (print source)
  Trim 90 × 50 mm, 3 mm bleed on every side → page 96 × 56 mm.
  All positions below are measured from the trim edge (var(--b) adds the bleed).
  Re-render: node brand/business-card/render.mjs
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>STL Business Card — Abdulrahman Ameen</title>
<style>
  @font-face { font-family: 'Readex Pro'; font-weight: 300; src: url(fonts/readex-pro-latin-300-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Readex Pro'; font-weight: 400; src: url(fonts/readex-pro-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Readex Pro'; font-weight: 500; src: url(fonts/readex-pro-latin-500-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Readex Pro'; font-weight: 600; src: url(fonts/readex-pro-latin-600-normal.woff2) format('woff2'); }

  :root { --petrol: #245091; --coral: #ff7058; --paper: #ffffff; --ink: #0e1a2e; --line: #e3e8f0; --b: 3mm; }
  @page { size: 96mm 56mm; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #777; }
  body { font-family: 'Readex Pro', sans-serif; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .card { position: relative; width: 96mm; height: 56mm; overflow: hidden; break-after: page; }
  .card:last-child { break-after: auto; }
  @media screen { body { display: grid; gap: 8mm; padding: 10mm; justify-content: center; } }
  .abs { position: absolute; }

  /* ---------------- FRONT ---------------- */
  .front { background: var(--paper); color: var(--ink); }
  .front .logo { left: calc(var(--b) + 6.6mm); top: calc(var(--b) + 6.4mm); height: 9.4mm; }
  .front .qr { right: calc(var(--b) + 6.4mm); top: calc(var(--b) + 5.6mm); width: 20.4mm; height: 20.4mm; }
  .front .name { left: calc(var(--b) + 6.5mm); top: calc(var(--b) + 19.8mm); font-size: 12.6pt; font-weight: 600; color: var(--petrol); letter-spacing: -.005em; line-height: 1; }
  .front .role { left: calc(var(--b) + 6.6mm); top: calc(var(--b) + 25.2mm); display: flex; align-items: center; gap: 1mm; font-size: 10pt; font-weight: 300; color: var(--coral); line-height: 1; }
  .front .role::before { content: ''; width: .75mm; height: 3.2mm; background: var(--coral); }
  .front .rule { left: calc(var(--b) + 6.4mm); top: calc(var(--b) + 32.5mm); width: 62.8mm; height: .25mm; background: var(--line); }
  .front .contact { left: calc(var(--b) + 6.6mm); top: calc(var(--b) + 38.1mm); display: grid; grid-template-columns: 28.4mm auto; row-gap: 1.7mm; font-size: 6.1pt; font-weight: 400; color: var(--ink); }
  .front .contact div { display: flex; align-items: center; gap: 1.8mm; white-space: nowrap; line-height: 1; }
  .front .contact svg { width: 2.3mm; height: 2.3mm; flex-shrink: 0; stroke: var(--coral); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: .85; }

  /* ---------------- BACK ---------------- */
  .back { background: var(--petrol); }
  .back .logo { left: 50%; top: calc(var(--b) + 11.6mm); transform: translateX(-50%); height: 22.4mm; }
  .back .web { left: 50%; top: calc(var(--b) + 40.6mm); transform: translateX(-50%); display: flex; align-items: center; gap: 1.6mm; font-size: 8.6pt; font-weight: 300; color: var(--coral); white-space: nowrap; line-height: 1; }
  .back .web::before, .back .web::after { content: ''; width: 5.2mm; height: .2mm; background: var(--coral); }

  .guides .card::after { content: ''; position: absolute; inset: var(--b); outline: .2mm dashed rgba(255, 0, 140, .7); pointer-events: none; }
  .guides .card::before { content: ''; position: absolute; inset: calc(var(--b) + 3mm); outline: .2mm dotted rgba(0, 160, 255, .7); pointer-events: none; z-index: 5; }
</style>
</head>
<body>
  <!-- FRONT -->
  <section class="card front">
    <img class="abs logo" src="../../public/brand/stl-logo.svg" alt="STL Global Forwarding" />
    <img class="abs qr" src="qr-stl-gf.svg" alt="QR: http://stl-gf.com" />
    <div class="abs name">Abdulrahman Ameen</div>
    <div class="abs role">General Manager</div>
    <div class="abs rule"></div>
    <div class="abs contact">
      <div><svg viewBox="0 0 24 24"><path d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></svg><span>+966532133699</span></div>
      <div><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg><span>info@stl-gf.com</span></div>
      <div><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg><span>www.stl-gf.com</span></div>
      <div><svg viewBox="0 0 24 24"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Jeddah, Saudi Arabia</span></div>
    </div>
  </section>

  <!-- BACK -->
  <section class="card back">
    <img class="abs logo" src="../../public/brand/stl-logo-white.svg" alt="STL Global Forwarding" />
    <div class="abs web">https://www.stl-gf.com</div>
  </section>
</body>
</html>
